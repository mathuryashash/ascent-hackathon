name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install flake8 pytest pytest-mock

      - name: Install brain service dependencies
        run: pip install -r services/brain/requirements.txt

      - name: Lint (brain service)
        run: |
          flake8 services/brain \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --ignore=E501,W503

      - name: Run unit tests
        run: pytest services/brain/tests/ -v --tb=short

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check .env.example has required keys
        run: |
          REQUIRED=(WEBHOOK_SECRET CLAUDE_API_KEY GEMINI_API_KEY GROQ_API_KEY ANTHROPIC_API_KEY)
          for key in "${REQUIRED[@]}"; do
            grep -q "^${key}=" .env.example || { echo "Missing required key: ${key}"; exit 1; }
          done
          echo "All required env keys present in .env.example ✅"

      - name: Build orchestrator image
        run: docker build -t chimera-brain-test ./services/brain
