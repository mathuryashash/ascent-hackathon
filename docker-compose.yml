services:
  # ─────────────────────────────────────────
  # SERVICE 1: VICTIM (Intentionally Vulnerable Flask App with UI)
  # ─────────────────────────────────────────
  victim:
    build:
      context: ./services/victim_sandbox/victim
      dockerfile: Dockerfile
    container_name: chimera-victim
    networks:
      - chimera-internal
      - chimera-external   # Exposed so host browser can view the UI
    volumes:
      - ./services/victim_sandbox/victim:/app       # Live source mount — patches take effect on Flask reload
      - ./services/victim_sandbox/logs:/app/logs    # SIEM tails this
      - victim-db:/data                             # Persist DB across Flask debug reloads
    ports:
      - "127.0.0.1:5000:5000"   # View victim UI at http://localhost:5000 (loopback only)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # SERVICE 2: SANDBOX (Isolated execution environment)
  # ─────────────────────────────────────────
  sandbox:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    container_name: chimera-sandbox
    networks:
      - chimera-internal   # ONLY internal — NO internet access
    command: tail -f /dev/null
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW    # required for nmap ICMP probes
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ok"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # SERVICE 3: ORCHESTRATOR (LangGraph Brain)
  # ─────────────────────────────────────────
  orchestrator:
    build:
      context: ./services/brain
      dockerfile: Dockerfile
    container_name: chimera-orchestrator
    networks:
      - chimera-internal   # Can reach victim & sandbox
      - chimera-external   # Can reach LLM APIs on the internet
    ports:
      - "8000:8000"        # FastAPI webhook ingress + status polling
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker SDK to exec into sandbox (read-only: exec_run only)
      - ./services/victim_sandbox/victim:/victim_src:ro    # Read-only source for Architect
      - ./services/victim_sandbox/victim:/victim_dst       # Writable for patch application
      - ./services/victim_sandbox/logs:/app/logs           # Victim logs for get_logs tool
    environment:
      VICTIM_SRC_PATH: /victim_src
      VICTIM_DST_PATH: /victim_dst
      LOG_PATH: /app/logs/access.log
      SANDBOX_CONTAINER: chimera-sandbox
      VICTIM_HOST: http://chimera-victim:5000
    env_file:
      - .env
    depends_on:
      victim:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────
  # SERVICE 4: GATEWAY UI (Chimera Control Center Dashboard)
  # ─────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway_ui
      dockerfile: Dockerfile
    container_name: chimera-gateway
    networks:
      - chimera-external
    ports:
      - "3001:3000"        # Browser dashboard at http://localhost:3001
    environment:
      PORT: "3000"
      ORCHESTRATOR_URL: "http://chimera-orchestrator:8000"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
    depends_on:
      - orchestrator
    restart: unless-stopped

  # ─────────────────────────────────────────
  # SERVICE 5: SIEM SIMULATOR (Log watcher — stdlib only, no Docker SDK)
  # ─────────────────────────────────────────
  siem:
    image: python:3.11-slim
    container_name: chimera-siem
    networks:
      - chimera-external   # Needs to reach orchestrator webhook
    volumes:
      - ./services/victim_sandbox/logs:/logs:ro    # Read victim logs
      - ./siem_simulator.py:/app/siem_simulator.py:ro
    working_dir: /app
    environment:
      VICTIM_LOG_PATH: /logs/access.log
      WEBHOOK_URL: "http://chimera-orchestrator:8000/webhook/alert"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
    command: python siem_simulator.py
    depends_on:
      - orchestrator
    restart: unless-stopped

# ─────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────
networks:
  chimera-internal:
    driver: bridge
    internal: true    # CRITICAL: blocks all internet access for sandbox
  chimera-external:
    driver: bridge
    internal: false   # Orchestrator & SIEM get internet access

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes:
  victim-db:   # Persists SQLite DB across Flask debug reloads so the flag survives
