name: chimera

# Network topology:
#   public_net   → orchestrator, siem, gateway_ui  (internet-accessible)
#   internal_net → sandbox, victim only            (no internet, internal: true)
# The orchestrator reaches sandbox/victim via the Docker socket (exec/SDK),
# NOT through a network route, so it stays on public_net only.

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true   # no internet egress for sandbox or victim

volumes:
  victim_data:
  checkpoints:

services:

  # ── Victim: intentionally vulnerable Flask app ──────────────────────────
  victim:
    build:
      context: services/victim_sandbox/victim
      dockerfile: Dockerfile
    container_name: chimera-victim-1
    ports:
      - "5000:5000"
    networks:
      - internal_net
      - public_net
    volumes:
      - victim_data:/data
      - ./services/victim_sandbox/victim:/app:rw
    environment:
      - DB_PATH=/data/victim.db
      - LOG_PATH=/data/access.log
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Sandbox: isolated payload execution environment ──────────────────────
  sandbox:
    build:
      context: services/victim_sandbox/sandbox
      dockerfile: Dockerfile
    container_name: chimera-sandbox-1
    networks:
      - internal_net
      - public_net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes: []
    cpus: "0.5"
    user: "1002:1002"
    restart: unless-stopped

  # ── Orchestrator: LangGraph brain (built by Member 2) ───────────────────
  orchestrator:
    build:
      context: .
      dockerfile: services/brain/Dockerfile
    container_name: chimera-orchestrator-1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8002:8000"
    networks:
      - public_net
    volumes:
      # Host-side Docker socket — used only by tools.py
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - checkpoints:/app/checkpoints
      - victim_data:/victim_data
      # Victim source exposed read-only so Architect can read and patch it
      - ./services/victim_sandbox/victim:/victim_src:rw
      # Brain source exposed for live iteration
      - ./services/brain:/app:rw
    environment:
      VICTIM_SRC_PATH: /victim_src
      VICTIM_DST_PATH: /victim_dst
      LOG_PATH: /victim_data/access.log
      SANDBOX_CONTAINER: chimera-sandbox-1
      VICTIM_CONTAINER: chimera-victim-1
      VICTIM_HOST: http://chimera-victim-1:5000
      ALLOWED_ORIGIN: "*"
      # Set to HTB\{[^}]+\} for HackTheBox, or leave default to match both HTB and CHIMERA flags
      FLAG_PATTERN: "(?:HTB|CHIMERA)\\{[^}]+\\}"
      DEMO_TRIGGER_ENABLED: "true"
      OMIUM_API_KEY: "${OMIUM_API_KEY}"
    env_file:
      - .env
    depends_on:
      victim:
        condition: service_healthy
      sandbox:
        condition: service_started
    restart: unless-stopped

  # ── SIEM: log monitor + webhook dispatcher ───────────────────────────────
  siem:
    build:
      context: services/victim_sandbox/siem
      dockerfile: Dockerfile
    container_name: chimera-siem-1
    networks:
      - public_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VICTIM_LOG_PATH: /logs/access.log
      WEBHOOK_URL: "http://orchestrator:8000/webhook/alert"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      VICTIM_CONTAINER: chimera-victim-1
      POLL_INTERVAL: 5
      PYTHONUNBUFFERED: "1"
    depends_on:
      - victim
      - orchestrator
    restart: unless-stopped

  # ── Gateway UI: monitoring dashboard (built by Member 3) ────────────────
  gateway_ui:
    build:
      context: services/gateway_ui
      dockerfile: Dockerfile
    container_name: chimera-gateway-1
    ports:
      - "3002:3000"
    networks:
      - public_net
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - orchestrator
    restart: unless-stopped
