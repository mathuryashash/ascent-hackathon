<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CHIMERA — Event Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@500;600;700&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{"background":"#0b1326","on-secondary":"#213145","tertiary-container":"#5be9ad","on-primary-fixed-variant":"#004f58","on-tertiary-container":"#006645","on-tertiary":"#003824","on-secondary-container":"#a9bad3","secondary":"#b7c8e1","on-tertiary-fixed":"#002113","tertiary":"#a8ffd2","surface-container":"#171f33","error-container":"#93000a","primary-fixed":"#9cf0ff","surface-container-low":"#131b2e","on-error":"#690005","outline-variant":"#3b494c","surface":"#0b1326","secondary-fixed":"#d3e4fe","inverse-on-surface":"#283044","surface-dim":"#0b1326","surface-tint":"#00daf3","on-secondary-fixed":"#0b1c30","outline":"#849396","on-primary-container":"#00626e","inverse-surface":"#dae2fd","primary-container":"#00e5ff","tertiary-fixed-dim":"#4edea3","on-surface-variant":"#bac9cc","on-secondary-fixed-variant":"#38485d","primary":"#c3f5ff","surface-bright":"#31394d","inverse-primary":"#006875","error":"#ffb4ab","secondary-container":"#3a4a5f","on-surface":"#dae2fd","on-background":"#dae2fd","on-tertiary-fixed-variant":"#005236","surface-container-highest":"#2d3449","surface-container-lowest":"#060e20","on-primary-fixed":"#001f24","on-error-container":"#ffdad6","secondary-fixed-dim":"#b7c8e1","surface-container-high":"#222a3d","on-primary":"#00363d","tertiary-fixed":"#6ffbbe","surface-variant":"#2d3449","primary-fixed-dim":"#00daf3"},
    borderRadius:{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
    spacing:{"base":"4px","gutter":"20px","xs":"4px","margin-mobile":"16px","margin-desktop":"32px","sm":"8px","md":"16px","xl":"40px","lg":"24px"},
    fontFamily:{"body-sm":["Inter"],"display":["Geist"],"headline-lg":["Geist"],"headline-md":["Geist"],"body-md":["Inter"],"body-lg":["Inter"],"headline-sm":["Geist"],"headline-lg-mobile":["Geist"],"label-caps":["Geist"],"code-sm":["JetBrains Mono"]},
    fontSize:{"body-sm":["14px",{"lineHeight":"1.5","fontWeight":"400"}],"display":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg":["32px",{"lineHeight":"1.2","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"1.3","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"1.6","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"headline-sm":["20px",{"lineHeight":"1.4","fontWeight":"500"}],"headline-lg-mobile":["24px",{"lineHeight":"1.2","fontWeight":"600"}],"label-caps":["12px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"700"}],"code-sm":["13px",{"lineHeight":"1.4","fontWeight":"400"}]}
  }}
}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.glass-card{background:rgba(23,31,51,0.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3b494c;border-radius:10px}
.log-line{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;padding:2px 8px;border-radius:2px}
.log-line:hover{background:rgba(195,245,255,0.03)}
.fade-in{animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden h-screen flex flex-col">

<header class="flex justify-between items-center w-full px-margin-desktop h-16 sticky top-0 z-50 bg-surface/40 backdrop-blur-md border-b border-outline-variant/30 shrink-0">
  <div class="flex items-center gap-lg">
    <span class="font-display text-headline-md font-bold text-primary tracking-tight">CHIMERA</span>
    <span class="font-label-caps text-label-caps text-on-surface-variant">/ Event Stream</span>
  </div>
  <div class="flex items-center gap-md">
    <div class="flex items-center gap-xs px-sm py-1 rounded border" id="ws-badge" style="background:rgba(255,180,171,0.1);border-color:rgba(255,180,171,0.2)">
      <span class="w-1.5 h-1.5 rounded-full bg-error" id="ws-dot"></span>
      <span class="font-label-caps text-[10px] text-error" id="ws-label">CONNECTING</span>
    </div>
    <span class="font-code-sm text-[11px] text-on-surface-variant"><span id="event-count">0</span> events</span>
    <button onclick="clearLog()" class="glass-card px-md py-sm rounded font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">
      <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
    </button>
    <button onclick="togglePause()" id="pause-btn" class="glass-card px-md py-sm rounded flex items-center gap-sm font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">
      <span class="material-symbols-outlined text-[16px]">pause</span> Pause
    </button>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
  <aside class="hidden md:flex flex-col h-full py-lg gap-md bg-surface-container-low/60 backdrop-blur-xl border-r border-outline-variant/20 w-56 shrink-0">
    <div class="px-lg pb-md">
      <div class="flex items-center gap-sm">
        <div class="w-8 h-8 bg-error/20 rounded flex items-center justify-center border border-error/30">
          <span class="material-symbols-outlined text-[20px] text-error">security</span>
        </div>
        <div>
          <div class="font-display text-headline-sm font-bold text-primary">Chimera</div>
          <div class="font-label-caps text-label-caps text-on-surface-variant">Autonomous SecOps</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 px-sm space-y-1">
      <a class="flex items-center gap-md px-md py-2.5 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded" href="index.html">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="font-label-caps text-label-caps">Command Center</span>
      </a>
      <a class="flex items-center gap-md px-md py-2.5 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded" href="orchestration.html">
        <span class="material-symbols-outlined">account_tree</span>
        <span class="font-label-caps text-label-caps">Pipeline</span>
      </a>
      <a class="flex items-center gap-md px-md py-2.5 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded" href="observability.html">
        <span class="material-symbols-outlined">analytics</span>
        <span class="font-label-caps text-label-caps">Metrics</span>
      </a>
      <a class="flex items-center gap-md px-md py-2.5 text-primary border-r-2 border-primary bg-primary/5 transition-all rounded translate-x-1" href="logs.html">
        <span class="material-symbols-outlined">terminal</span>
        <span class="font-label-caps text-label-caps">Event Stream</span>
      </a>
    </nav>

    <!-- Event type filters -->
    <div class="px-md space-y-sm">
      <div class="font-label-caps text-[10px] text-on-surface-variant mb-sm">FILTER BY TYPE</div>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-alert_received" checked onchange="applyFilter()" class="accent-[#f4d160]"/>
        <span class="font-code-sm text-[11px]" style="color:#f4d160">alert_received</span>
      </label>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-pipeline_step" checked onchange="applyFilter()" class="accent-[#c3f5ff]"/>
        <span class="font-code-sm text-[11px]" style="color:#c3f5ff">pipeline_step</span>
      </label>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-pipeline_complete" checked onchange="applyFilter()" class="accent-[#a8ffd2]"/>
        <span class="font-code-sm text-[11px]" style="color:#a8ffd2">pipeline_complete</span>
      </label>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-pipeline_error" checked onchange="applyFilter()" class="accent-[#ffb4ab]"/>
        <span class="font-code-sm text-[11px]" style="color:#ffb4ab">pipeline_error</span>
      </label>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-human_approved" checked onchange="applyFilter()"/>
        <span class="font-code-sm text-[11px]" style="color:#a8ffd2">human_approved</span>
      </label>
      <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="f-human_rejected" checked onchange="applyFilter()"/>
        <span class="font-code-sm text-[11px]" style="color:#ffb4ab">human_rejected</span>
      </label>
    </div>

    <!-- Trace filter -->
    <div class="px-md space-y-sm">
      <div class="font-label-caps text-[10px] text-on-surface-variant">FILTER BY TRACE</div>
      <input type="text" id="trace-filter" placeholder="trace prefix…" oninput="applyFilter()"
        class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded px-sm py-1 font-code-sm text-[11px] text-on-surface outline-none placeholder-on-surface-variant"/>
    </div>

    <!-- Stats -->
    <div class="px-md mt-auto pb-md">
      <div class="glass-card p-sm rounded-xl">
        <div class="font-label-caps text-[10px] text-on-surface-variant mb-sm">EVENT COUNTS</div>
        <div id="type-counts" class="space-y-xs"></div>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden bg-surface-container-lowest">

    <!-- Search bar -->
    <div class="shrink-0 border-b border-outline-variant/20 p-sm flex items-center gap-sm bg-surface-container/50">
      <span class="material-symbols-outlined text-outline text-[18px]">search</span>
      <input type="text" id="search-input" placeholder="Search event data…" oninput="applyFilter()"
        class="flex-1 bg-transparent font-code-sm text-[12px] text-on-surface placeholder-on-surface-variant outline-none"/>
      <span class="font-code-sm text-[11px] text-on-surface-variant"><span id="shown-count">0</span> shown</span>
      <label class="flex items-center gap-xs cursor-pointer ml-sm">
        <input type="checkbox" id="autoscroll" checked class="accent-primary"/>
        <span class="font-label-caps text-[10px] text-on-surface-variant">Auto-scroll</span>
      </label>
    </div>

    <!-- Log terminal -->
    <div class="flex-1 overflow-y-auto bg-surface-container-lowest" id="log-container">
      <div id="log-lines"></div>
      <div id="log-cursor" class="flex gap-sm py-0.5 px-sm">
        <span style="color:#3b494c;min-width:180px" class="font-code-sm text-[11px]">waiting for events…</span>
        <span class="inline-block w-2 h-4 rounded-sm animate-pulse" style="background:#c3f5ff;margin-top:2px"></span>
      </div>
    </div>

    <!-- Status bar -->
    <div class="shrink-0 border-t border-outline-variant/20 px-md py-sm flex items-center justify-between bg-surface-container/80">
      <span class="font-code-sm text-[11px] text-on-surface-variant">WebSocket: <span id="ws-url" style="color:#c3f5ff">ws://localhost:8001/ws</span></span>
      <span class="font-code-sm text-[11px] text-on-surface-variant">Buffer: <span id="buffer-count">0</span> / 500</span>
    </div>
  </main>
</div>

<script>
const WS_URL = 'ws://localhost:8001/ws';

// Event types and their colors
const EVT_CONFIG = {
  alert_received:   { color:'#f4d160', label:'ALERT',    icon:'warning'          },
  pipeline_step:    { color:'#c3f5ff', label:'STEP',     icon:'chevron_right'    },
  pipeline_complete:{ color:'#a8ffd2', label:'DONE',     icon:'check_circle'     },
  pipeline_error:   { color:'#ffb4ab', label:'ERROR',    icon:'error'            },
  human_approved:   { color:'#a8ffd2', label:'APPROVED', icon:'thumb_up'         },
  human_rejected:   { color:'#ffb4ab', label:'REJECTED', icon:'thumb_down'       },
};
const DEFAULT_COLOR = '#849396';

let ws = null;
let allEvents = []; // full event buffer (max 500)
let paused = false;
let typeCounts = {};

// ── WebSocket ──
function connectWS() {
  try { ws = new WebSocket(WS_URL); } catch(_) { setTimeout(connectWS, 3000); return; }
  ws.onopen = () => {
    setWSStatus('connected');
    appendSystemLine('Connected to orchestrator WebSocket at ' + WS_URL);
  };
  ws.onclose = () => {
    setWSStatus('offline');
    appendSystemLine('WebSocket disconnected. Retrying in 3s…');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => setWSStatus('error');
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleEvent(msg);
    } catch(_) {}
  };
}

function setWSStatus(s) {
  const dot = document.getElementById('ws-dot');
  const lbl = document.getElementById('ws-label');
  const badge = document.getElementById('ws-badge');
  if (s === 'connected') {
    dot.style.background='#a8ffd2'; lbl.textContent='LIVE'; lbl.style.color='#a8ffd2';
    badge.style.background='rgba(168,255,210,0.1)'; badge.style.borderColor='rgba(168,255,210,0.2)';
  } else {
    dot.style.background='#ffb4ab'; lbl.textContent=s==='offline'?'OFFLINE':'ERROR'; lbl.style.color='#ffb4ab';
    badge.style.background='rgba(255,180,171,0.1)'; badge.style.borderColor='rgba(255,180,171,0.2)';
  }
}

// ── Event handling ──
function handleEvent(msg) {
  const evt = { ...msg, _ts: Date.now(), _id: allEvents.length };
  allEvents.push(evt);
  if (allEvents.length > 500) allEvents.shift();

  typeCounts[msg.event] = (typeCounts[msg.event] || 0) + 1;
  updateTypeCounts();
  document.getElementById('event-count').textContent = allEvents.length;
  document.getElementById('buffer-count').textContent = allEvents.length;

  if (!paused) {
    appendEventLine(evt);
  }
}

function appendSystemLine(text) {
  const container = document.getElementById('log-lines');
  const line = document.createElement('div');
  line.className = 'log-line fade-in';
  line.style.color = '#3b494c';
  line.textContent = `[${ts()}] SYS  ${text}`;
  container.appendChild(line);
  autoScroll();
}

function appendEventLine(evt) {
  if (!passesFilter(evt)) return;
  const container = document.getElementById('log-lines');
  const line = document.createElement('div');
  line.className = 'log-line fade-in';
  line.dataset.event = evt.event;
  line.dataset.id = evt._id;

  const cfg = EVT_CONFIG[evt.event] || { color: DEFAULT_COLOR, label: 'INFO' };
  const traceId = extractTraceId(evt);
  const shortTrace = traceId ? traceId.slice(0, 8) + '…' : '        ';
  const detail = buildDetail(evt);

  line.innerHTML = [
    `<span style="color:#3b494c;user-select:none">${ts()}</span>`,
    ` <span style="color:${cfg.color};min-width:100px;display:inline-block;font-weight:700">${cfg.label.padEnd(10)}</span>`,
    ` <span style="color:#849396;min-width:80px;display:inline-block">${shortTrace}</span>`,
    ` <span style="color:${cfg.color}">${esc(detail)}</span>`,
  ].join('');

  container.appendChild(line);
  autoScroll();
  updateShownCount();
}

function buildDetail(evt) {
  switch (evt.event) {
    case 'alert_received': {
      const d = evt.data || {};
      return `Attack detected • type=${d.type || '?'} source=${d.source || '?'}`;
    }
    case 'pipeline_step': {
      const key = Object.keys(evt.data || {})[0] || '?';
      const s = (evt.data || {})[key] || {};
      const status = s.status || '?';
      const node = s.current_node || key;
      const iters = s.iteration_count != null ? ` iter=${s.iteration_count}` : '';
      return `Node: ${node}  status=${status}${iters}`;
    }
    case 'pipeline_complete': {
      const d = evt.data || {};
      return `Pipeline ${d.status?.toUpperCase() || 'DONE'} — trace=${d.trace_id?.slice(0,8)}`;
    }
    case 'pipeline_error': {
      const d = evt.data || {};
      return `ERROR: ${d.error || 'unknown error'}`;
    }
    case 'human_approved':
      return `Patch approved — pipeline resuming`;
    case 'human_rejected':
      return `Patch rejected — pipeline ended`;
    default:
      return JSON.stringify(evt.data || {}).slice(0, 120);
  }
}

function extractTraceId(evt) {
  if (evt.data?.trace_id) return evt.data.trace_id;
  if (evt.event === 'pipeline_step' && evt.data) {
    const key = Object.keys(evt.data)[0];
    return key ? evt.data[key]?.trace_id : null;
  }
  return null;
}

// ── Filters ──
function passesFilter(evt) {
  const typeFilter = document.getElementById(`f-${evt.event}`);
  if (typeFilter && !typeFilter.checked) return false;

  const traceFilter = document.getElementById('trace-filter').value.trim().toLowerCase();
  if (traceFilter) {
    const tid = (extractTraceId(evt) || '').toLowerCase();
    if (!tid.startsWith(traceFilter)) return false;
  }

  const search = document.getElementById('search-input').value.trim().toLowerCase();
  if (search) {
    const raw = JSON.stringify(evt).toLowerCase();
    if (!raw.includes(search)) return false;
  }

  return true;
}

function applyFilter() {
  const container = document.getElementById('log-lines');
  container.innerHTML = '';
  for (const evt of allEvents) {
    appendEventLine(evt);
  }
  updateShownCount();
}

function updateShownCount() {
  const lines = document.getElementById('log-lines').children.length;
  document.getElementById('shown-count').textContent = lines;
}

// ── Controls ──
function clearLog() {
  allEvents = [];
  typeCounts = {};
  document.getElementById('log-lines').innerHTML = '';
  document.getElementById('event-count').textContent = 0;
  document.getElementById('buffer-count').textContent = 0;
  updateTypeCounts();
  updateShownCount();
}

let pausedBefore = [];
function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pause-btn');
  if (paused) {
    btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">play_arrow</span> Resume';
    btn.style.color = '#f4d160';
  } else {
    btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">pause</span> Pause';
    btn.style.color = '';
    // Flush buffered events
    applyFilter();
  }
}

function autoScroll() {
  if (!document.getElementById('autoscroll').checked) return;
  const container = document.getElementById('log-container');
  container.scrollTop = container.scrollHeight;
}

function updateTypeCounts() {
  const container = document.getElementById('type-counts');
  container.innerHTML = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([type, count]) => {
    const color = (EVT_CONFIG[type]||{}).color || DEFAULT_COLOR;
    return `<div class="flex justify-between items-center">
      <span class="font-code-sm text-[10px]" style="color:${color}">${type.replace(/_/g,' ')}</span>
      <span class="font-code-sm text-[10px]" style="color:#849396">${count}</span>
    </div>`;
  }).join('');
}

function ts() {
  return new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──
connectWS();
appendSystemLine(`Dashboard initialized. Connecting to ${WS_URL}…`);
</script>
</body>
</html>
